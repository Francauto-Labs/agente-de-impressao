version: '3.8'

services:
  agente-impressao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente-impressao
    network_mode: "host" # Usa a pilha de rede direta do Linux (elimina ponte NAT do Docker)
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4005}
      - PRINT_MODE=${PRINT_MODE:-pcl}
      - PRINT_COLOR=${PRINT_COLOR:-false}
      - GHOSTSCRIPT_BIN=${GHOSTSCRIPT_BIN:-gs}
      - SMB_USER=${SMB_USER:-}
      - SMB_PASSWORD=${SMB_PASSWORD:-}
      - SMB_DOMAIN=${SMB_DOMAIN:-}
